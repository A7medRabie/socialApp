<form class="w-full" >
  <label for="comment" class="sr-only">{{'comments.placeholder' | translate}}</label>

  <div class="flex items-center px-3 py-2 rounded-2xl bg-comment border border-gray-400 shadow-sm">

    <!-- Textarea -->
    <textarea [formControl]="content"
      id="comment"
      rows="1"
      class="flex-1 mx-3 bg-transparent resize-none outline-none border-none text-primary text-sm placeholder:text-secondary focus:ring-0 focus:border-none"
      placeholder="{{'comments.placeholder' | translate}}"
    ></textarea>

    <!-- Send Button -->
    <button
       (click)="onsubmit($event)"
         type="submit"
         [disabled]="content.invalid"
        class="inline-flex  justify-center p-2 rounded-full text-accent disabled:opacity-40 hover:bg-transparent cursor-pointer"
    >
      <svg
        class="w-6 h-6 rotate-90 rtl:-rotate-90"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path d="m12 18-7 3 7-18 7 18-7-3Zm0 0v-5" />
      </svg>
      <span class="sr-only">Send comment</span>
    </button>

  </div>
</form>
